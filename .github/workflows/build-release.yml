name: Build Release APK

# Hanya dijalankan manual: tab Actions > Build Release APK > Run workflow.
on:
  workflow_dispatch:
    inputs:
      buat_release:
        description: 'Lampirkan APK ke GitHub Release (tag v<versi>)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifikasi level (solver)
        run: python3 tools/buat_level.py

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan keystore penandatanganan
        env:
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$S_KEYSTORE_BASE64" ]; then
            echo "Memakai keystore dari GitHub Secrets"
            echo "$S_KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$S_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$S_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$S_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Secrets tidak ada: membuat keystore sementara (APK tetap release & bisa dipasang)"
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
              -alias susunkata -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass susunkata-ci -keypass susunkata-ci \
              -dname "CN=Hanz Dev Official, O=Hanz Dev Official, C=ID"
            echo "KEYSTORE_PASSWORD=susunkata-ci" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=susunkata" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=susunkata-ci" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build APK release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Siapkan berkas hasil
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SusunKata-v${VER}-release.apk"
          ls -la out
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: SusunKata-release-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Buat GitHub Release
        if: ${{ inputs.buat_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          name: Susun Kata v${{ env.APP_VERSION }}
          body: |
            Susun Kata, game susun kata bahasa Indonesia.
            Pengembang: Hanz Dev Official (hanzzcodee@gmail.com)
            Dukung: https://saweria.co/hanzreally

            Unduh berkas .apk di bawah, lalu pasang di Android 7.0 ke atas.
